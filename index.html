<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/udm-logo.png" />
    <title>UDM-ResearchHub | Web-Based Research Archives</title>
    <meta name="description" content="An AI-Powered Web-Based Research Archives for Universidad de Manila Using Machine Learning (URELIA Office)." />
    <meta property="og:title" content="UDM-ResearchHub | Web-Based Research Archives" />
    <meta property="og:description" content="An AI-Powered Web-Based Research Archives for Universidad de Manila Using Machine Learning (URELIA Office)." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Suppress Vite HMR WebSocket connection errors in iframe / proxy environments
      (function () {
        var isWsError = function (str) {
          if (!str) return false;
          var s = String(str).toLowerCase();
          return s.indexOf('websocket') !== -1 || s.indexOf('failed to connect to websocket') !== -1 || s.indexOf('closed without opened') !== -1 || s.indexOf('[vite]') !== -1;
        };

        var origError = console.error;
        console.error = function () {
          var text = Array.prototype.slice.call(arguments).map(function (a) {
            return String(a && a.message ? a.message : a);
          }).join(' ');
          if (isWsError(text)) return;
          origError.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function () {
          var text = Array.prototype.slice.call(arguments).map(function (a) {
            return String(a && a.message ? a.message : a);
          }).join(' ');
          if (isWsError(text)) return;
          origWarn.apply(console, arguments);
        };

        window.onerror = function (msg, url, line, col, error) {
          var text = String(msg || '') + ' ' + String(error || '');
          if (isWsError(text)) return true;
        };

        window.addEventListener('unhandledrejection', function (e) {
          var reason = e.reason ? (e.reason.message || String(e.reason)) : '';
          if (isWsError(reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function (e) {
          var msg = (e.message || '') + ' ' + (e.error ? (e.error.message || String(e.error)) : '');
          if (isWsError(msg)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
