<div style="font-family: Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; border: 1px solid #e2e8f0; border-radius: 12px; background-color: #ffffff;">
  <h2 style="color: #1a4731; margin-top: 0; font-size: 20px;">Universidad de Manila</h2>
  <p style="color: #64748b; font-size: 13px; margin: 0 0 16px 0;">UDM ResearchHub Institutional Portal</p>
  
  <p style="color: #334155; font-size: 14px; line-height: 1.5; margin: 0 0 16px 0;">
    Hello UDM Scholar,<br><br>
    Your 6-digit institutional account verification code is:
  </p>
  
  <div style="background-color: #f8fafc; border: 2px dashed #1a4731; border-radius: 8px; padding: 18px; text-align: center; margin: 20px 0;">
    <span style="font-family: monospace; font-size: 36px; font-weight: bold; letter-spacing: 10px; color: #1a4731;">{{ .Token }}</span>
  </div>
  
  <p style="color: #64748b; font-size: 12px; line-height: 1.4; margin: 0;">
    Enter this 6-digit code on the UDM ResearchHub verification screen to activate your account.<br>
    This code expires strictly in 5 minutes.
  </p>
</div>
